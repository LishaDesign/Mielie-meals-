:root[data-theme="dark"]{--bg:#1f1c10;--card:#2b2717;--tx:#f6f0dc;--mu:#b3aa88;--ac:#f5c518;--ac2:#40391a;--bd:#4a4220;--on:#2b2622;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px 14px 40px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 10px}
.hd{display:flex;align-items:center;gap:12px}
.logo{height:84px;width:84px;border-radius:19px;box-shadow:0 1px 4px rgba(0,0,0,.25);flex:none}
h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>label{flex:1;min-width:130px;font-size:13px;color:var(--mu)}
select,input,textarea,button{font:inherit;color:var(--tx)}
select,input[type=text],textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-top:3px}
textarea{min-height:80px}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
button.gr{background:#ececec;border-color:#dcdcdc;color:#2b2622;font-weight:600}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:10px 4px}
.tabs button.on,.pills button.on{background:var(--ac2);border-color:var(--ac);font-weight:600}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.pills button{padding:7px 11px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:99px;background:var(--ac2);font-size:14px}
.chip b{cursor:pointer;margin-left:6px;color:var(--mu)}
.sug{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.slot{display:flex;flex-direction:column;gap:4px}
.slot small{color:var(--mu);font-size:13px}
.link{background:none;border:none;padding:2px 0;color:var(--tx);text-decoration:underline;text-align:left;font-weight:600}
.rc{display:flex;gap:12px;align-items:center;cursor:pointer}
.th{width:52px;height:52px;border-radius:12px;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.big{width:100%;height:190px;border-radius:14px;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:84px;overflow:hidden;margin-bottom:10px}
.big img{width:100%;height:100%;object-fit:cover}
.mu{color:var(--mu);font-size:14px}
ul,ol{padding-left:22px;margin:6px 0}
li{margin:4px 0}
.hide{display:none}
.emos{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.emo{font-size:22px;padding:6px 0;line-height:1;min-width:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.days button{padding:9px 0;font-size:13px;min-width:0}
.days button.on{background:var(--ac2);border-color:var(--ac);font-weight:600}
.seg{display:flex;gap:8px;margin:6px 0 12px}
.seg button{flex:1;padding:12px;font-weight:700;font-size:17px}
.seg button.on{background:#fbe27a;border-color:#f1cc45;color:var(--on)}
.dl{margin-left:auto;font-size:13px;padding:6px 10px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#2b2622;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;text-align:center;font-size:15px}
</style></head>

async function ask(prompt){
  try{
    var sm=window.claude?await window.claude.use("sample"):null;
    if(!sm)return null;
    return await sm.json(prompt);
  }catch(e){
    UI.msg=(e&&e.code==="rate_limited")?"Too many requests, please try again in a moment.":(e&&e.code==="not_granted")?"Permission was not given.":"Something went wrong, please try again.";
    return null;
  }
}
function guessE(x){x=x.toLowerCase();var m=[["chicken","🍗"],["fish","🐟"],["salmon","🐟"],["egg","🍳"],["pasta","🍝"],["rice","🍚"],["soup","🍲"],["stew","🍲"],["potato","🥔"],["carrot","🥕"],["banana","🍌"],["apple","🍎"],["oat","🥣"],["cheese","🧀"],["broccoli","🥦"],["avocado","🥑"],["tomato","🍅"],["beef","🥩"],["pancake","🥞"],["bread","🍞"],["berry","🫐"],["pumpkin","🎃"],["squash","🎃"]];for(var i=0;i<m.length;i++)if(x.indexOf(m[i][0])>-1)return m[i][1];return "🍽️"}
function clean(l){return l.replace(/^[\s•*\-–·]+/,"").trim()}
function cleanS(l){return clean(l).replace(/^(step\s*)?\d+\s*[.):]\s*/i,"").trim()}
function basicParse(t){
  var L=t.split("\n").map(function(x){return x.trim()}).filter(Boolean),a=-1,b=-1,i;
  for(i=0;i<L.length;i++){if(a<0&&/^ingredients?\b/i.test(L[i]))a=i;else if(a>=0&&b<0&&/^(method|instructions?|directions?|steps?|preparation|how to)\b/i.test(L[i]))b=i}
  if(a<0||b<0||b<=a+1)return null;
  var ing=L.slice(a+1,b).map(clean).filter(function(x){return x&&x.length<160}),st=[];
  for(i=b+1;i<L.length;i++){if(/^(nutrition|notes?|tips?|comments?|reviews?|related|you may|more recipes)\b/i.test(L[i]))break;var s=cleanS(L[i]);if(s.length>2&&s.length<400)st.push(s)}
  if(!ing.length||!st.length)return null;
  var nm=a>0?clean(L[0]).slice(0,60):"Imported recipe";
  return {n:nm,e:guessE(nm+" "+ing.join(" ")),i:ing.slice(0,25),s:st.slice(0,15)};
}
async function simplify(){
  var t=document.getElementById("it").value.trim();
  if(!t)return;
  if(/^https?:\/\/\S+$/.test(t)){UI.res=[];UI.msg="That is only a link, and this page cannot open websites. Paste the recipe text here, or send the link to Claude in chat.";render();return}
  var ad=UI.who==="a";
  UI.src="web";UI.busy=true;UI.msg="";UI.res=[];render();
  var d=await ask('Simplify this recipe'+(ad?'':' for a baby aged '+S.age+' months')+'. Keep only the recipe: a short name, a plain ingredient list and short method steps. Remove stories, tips, nutrition, ads and comments. '+(ad?'':'No honey, added salt or added sugar. ')+'Reply with JSON only: {"n":"name","e":"one emoji picture of the dish","i":["ingredient"],"s":["step"]}. Recipe text:\n'+t.slice(0,6000));
  UI.busy=false;
  if(d&&d.n&&Array.isArray(d.i)&&Array.isArray(d.s)){UI.res=[d];UI.msg=""}
  else{var q=basicParse(t);if(q){UI.res=[q];UI.msg="Simplified without Claude’s help. Please check it before saving."}else UI.msg="Could not find a recipe in that text. Make sure it includes the ingredients and the method."}
  render();
}
async function findEasy(){
  UI.imp=false;UI.adding=false;UI.res=[];UI.msg="";
  if(!S.pantry.length){UI.msg="Add some items to your Pantry first.";render();return}
  UI.src="idea";UI.busy=true;render();
  var ad=UI.who==="a";
  var d=await ask((ad?'Adults. Pantry: ':'Baby aged '+S.age+' months. Pantry: ')+S.pantry.join(", ")+'. Suggest 3 very easy '+(ad?"":"baby ")+'recipes (at most 5 short steps, few ingredients) using ONLY these pantry items plus water or oil. '+(ad?"":"Texture and ingredients must be safe for that age, no honey, added salt or added sugar. ")+'Reply with JSON only: an array of {"n":"name","e":"one emoji picture of the dish","i":["ingredient with amount"],"s":["step"]}.');
  UI.busy=false;
  var a=Array.isArray(d)?d:(d&&d.recipes);
  if(Array.isArray(a))UI.res=a.filter(function(x){return x&&x.n&&Array.isArray(x.i)&&Array.isArray(x.s)});
  else UI.msg=d===null?"Claude’s suggestions are not available here. These recipes already match your pantry:":"No ideas came back, please try again.";
  render();
}
function keep(i){
  var x=UI.res[i],w=document.getElementById("pw"+i),who=w?w.value:"b";
  S.custom.push({id:"c"+Date.now(),c:1,src:UI.src||"web",e:em(x.e),n:String(x.n),a:who==="a"?0:6,who:who,i:x.i.map(String),s:x.s.map(String),k:[]});
  UI.res.splice(i,1);UI.msg="";if(save())toast("Recipe saved");render();
}
function lines(id){return document.getElementById(id).value.split("\n").map(function(x){return x.trim()}).filter(Boolean)}
function saveR(){
  var n=document.getElementById("fn").value.trim(),i=lines("fi"),s=lines("fs");
  if(!n||!i.length){toast("Please add a name and at least one ingredient.");return}
  var old=UI.editId&&find(UI.editId),r=old||{id:"c"+Date.now(),c:1,e:"🍽️",k:[]};
  r.n=n;r.i=i;r.s=s;r.a=+document.getElementById("fa").value;r.who=document.getElementById("fw").value;
  var f=document.getElementById("ff").files[0];
  function done(){if(!old)S.custom.push(r);UI.adding=false;UI.editId=null;if(save())toast("Recipe saved");render()}
  if(!f){done();return}
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    var sc=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    r.img=c.toDataURL("image/jpeg",.7);done()};im.onerror=done;im.src=fr.result};
  fr.readAsDataURL(f);
}
function delR(id){
  S.custom=S.custom.filter(function(r){return r.id!==id});
  [S.plan,S.apl].forEach(function(p){for(var k in p)if(p[k]===id){delete p[k];delete S.link[k]}});
  save();UI.open=null;toast("Recipe deleted");render();
}

function plan(){
  var a=UI.who==="a";
  return '<div class="row" style="margin-bottom:10px"><button style="flex:1" onclick="UI.prep=!UI.prep;render()">'+(UI.prep?"Hide prep list":"Prep list")+'</button><button style="flex:1" onclick="two(\'clr\',clearW)">'+(UI.dc==="clr"?"Tap again to clear":"Clear week")+'</button></div>'+(UI.prep?prepList():"")+(a?planA():planB());
}
function fillBtn(w){var has=Object.keys(w==="a"?S.apl:S.plan).length>0,f=w==="a"?fillA:fill;if(has)two("fill"+w,f);else f()}
function clearW(){if(UI.who==="a"){S.apl={}}else{S.plan={}}S.link={};save();toast("Week cleared");render()}
function prepList(){
  var a=UI.who==="a",cnt={},ids=[];
  DAYS.forEach(function(d){
    var ks=a?[0,1,2]:slots().map(function(o){return o.i});
    ks.forEach(function(i){var k=d+"-"+i,id=a?S.apl[k]:bp(k);if(id){if(!cnt[id]){cnt[id]=0;ids.push(id)}cnt[id]++}})
  });
  if(!ids.length)return '<div class="card mu">Nothing planned yet.</div>';
  ids.sort(function(x,y){return cnt[y]-cnt[x]});
  return '<div class="card"><b>Prep list for the week</b>'+ids.map(function(id){var r=find(id);return r&&!r.isText?'<div style="margin-top:10px"><b>'+esc(r.e+" "+r.n)+' ×'+cnt[id]+'</b><ul>'+r.i.map(li).join("")+'</ul></div>':""}).join("")+'</div>';
}
function planB(){
  var h='<div class="row" style="margin-bottom:10px"><div class="pills" style="flex:1;margin:0"><button class="'+(UI.view==="day"?"on":"")+'" onclick="UI.view=\'day\';render()">Day</button><button class="'+(UI.view==="week"?"on":"")+'" onclick="UI.view=\'week\';render()">Week</button></div><button class="gr" onclick="fillBtn(\'b\')">'+(UI.dc==="fillb"?"Tap to replace":"Auto-fill week")+'</button></div>';
  if(UI.view==="day"){
    h+=dayPills();
    var SL=slots();for(var q=0;q<SL.length;q++){var s=SL[q].i,key=DAYS[UI.day]+"-"+s;
      if(S.link[key]&&S.apl[key]){var lr=find(S.apl[key]);h+='<div class="card slot"><small>'+SL[q].l+'</small><b>'+esc(lr.e+" "+lr.n)+'</b><small>Shared with adults</small><button class="link" onclick="UI.open=\''+lr.id+'\';render()">View recipe →</button><button class="link" onclick="unlink(\''+key+'\')">Unlink</button></div>';continue}
      var cur=S.plan[key];
      h+=slotCard("b",key,SL[q].l,s,all().filter(function(x){return x.a<=S.age&&(ok(x)||x.id===cur)}));
    }
  }else{
    h+=DAYS.map(function(d,i){
      var rows="";
      slots().forEach(function(o){var r=find(bp(d+"-"+o.i));rows+='<div class="mu">'+o.l+': <span style="color:var(--tx)">'+(r?esc(r.e+" "+r.n):"–")+'</span></div>'});
      return '<div class="card" onclick="UI.view=\'day\';UI.day='+i+';render()"><b>'+d+'</b>'+rows+'</div>';
    }).join("");
  }
  return h;
}
function planA(){
  var h='<div class="row" style="margin-bottom:10px"><div class="pills" style="flex:1;margin:0"><button class="'+(UI.view==="day"?"on":"")+'" onclick="UI.view=\'day\';render()">Day</button><button class="'+(UI.view==="week"?"on":"")+'" onclick="UI.view=\'week\';render()">Week</button></div><button class="gr" onclick="fillBtn(\'a\')">'+(UI.dc==="filla"?"Tap to replace":"Auto-fill week")+'</button></div>';
  if(UI.view==="day"){
    h+=dayPills();
    for(var s=0;s<3;s++){var key=DAYS[UI.day]+"-"+s,cur=S.apl[key];
      h+=slotCard("a",key,MEALN[s],s,allA().filter(function(x){return okA(x)||x.id===cur}));
    }
  }else{
    h+=DAYS.map(function(d,i){
      var rows="";
      for(var s=0;s<3;s++){var k=d+"-"+s,r=find(S.apl[k]);rows+='<div class="mu">'+MEALN[s]+': <span style="color:var(--tx)">'+(r?esc(r.e+" "+r.n)+(S.link[k]?" (shared with baby)":""):"–")+'</span></div>'}
      return '<div class="card" onclick="UI.view=\'day\';UI.day='+i+';render()"><b>'+d+'</b>'+rows+'</div>';
    }).join("");
  }
  return h;
}
function pickA(k,v){if(v)S.apl[k]=v;else delete S.apl[k];var r=v&&find(v);if(S.link[k]&&!(r&&canLink(r,+k.split("-")[1])))delete S.link[k];save();render()}
function setLink(k,on){if(on)S.link[k]=1;else{if(S.apl[k])S.plan[k]=S.apl[k];delete S.link[k]}save();render()}
function unlink(k){setLink(k,false)}
function fillA(){
  var pool=allA().filter(okA);
  if(!pool.length){toast("No adult recipes match your pantry yet. Add more items in Pantry.");return}
  var fam=pool.filter(function(r){return isFam(r)&&r.a<=S.age}),li=Math.min(2,S.per-1),n=0,m=0;
  S.link={};
  DAYS.forEach(function(d){for(var s=0;s<3;s++){var k=d+"-"+s;
    if(s===li&&fam.length){S.apl[k]=fam[m%fam.length].id;S.link[k]=1;m++}
    else{S.apl[k]=pool[n%pool.length].id;n++}}});
  save();render();
  if(!fam.length)toast("Week filled. No family meal matched your pantry and baby’s age, so nothing is shared yet.");
}
function dayPills(){return '<div class="days">'+DAYS.map(function(d,i){return '<button class="'+(UI.day===i?"on":"")+'" onclick="UI.day='+i+';render()">'+d+'</button>'}).join("")+'</div>'}
function slotCard(w,key,label,s,opts){
  var m=w==="a"?S.apl:S.plan,cur=m[key],r=cur&&find(cur);
  var h='<div class="card slot"><small>'+label+'</small><select onchange="pickX(\''+w+'\',\''+key+'\',this.value)"><option value="">Choose a recipe</option>'+opts.map(function(x){return '<option value="'+x.id+'"'+(x.id===cur?" selected":"")+'>'+esc(x.e+" "+x.n)+'</option>'}).join("")+'</select>';
  h+='<input type="text" placeholder="Or type your own words, e.g. leftovers" value="'+esc(r&&r.isText?r.n:"")+'" onchange="pickT(\''+w+'\',\''+key+'\',this.value)">';
  if(r&&!r.isText)h+='<button class="link" onclick="UI.open=\''+r.id+'\';render()">View recipe →</button>';
  if(w==="a"&&r&&canLink(r,s))h+='<label class="mu"><input type="checkbox" '+(S.link[key]?"checked":"")+' onchange="setLink(\''+key+'\',this.checked)"> Same meal for baby</label>';
  if(r)h+='<button class="link" onclick="two(\'rep'+key+'\',function(){repeatW(\''+w+'\',\''+key+'\')})">'+(UI.dc==="rep"+key?"Tap again to fill every day":"Repeat all week")+'</button>';
  return h+'</div>';
}
var EMO=["🍠","🥣","🍎","🍐","🥑","🍌","🥕","🎃","🍗","🥩","🐟","🍳","🥞","🍞","🧀","🥦","🍚","🍝","🍲","🥔","🍅","🫐","🍓","🥛","🍇","🍊","🥒","🌽","🥬","🧆","🥪","🌮","🍕","🍜","🥗","🍛","🥧","🧁","🍪","🍰","🫘","🥜","🍉","🍑","🥭","🍍","🥥","🍽️"];
function applyPics(){R.concat(A).forEach(function(r){var o=S.pics[r.id]||{};if(r.e0===undefined)r.e0=r.e;r.e=o.e||r.e0;if(o.img)r.img=o.img;else delete r.img})}
function picBtn(r){
  if(r.isText)return "";
  var h='<button class="link" style="margin-bottom:8px" onclick="UI.pic=UI.pic===\''+r.id+'\'?null:\''+r.id+'\';render()">'+(UI.pic===r.id?"Close picture options":"Change picture")+'</button>';
  if(UI.pic!==r.id)return h;
  h+='<div class="card"><div class="mu">Choose a picture</div><div class="emos">'+EMO.map(function(e){return '<button class="emo" onclick="setPic(\''+r.id+'\',\''+e+'\')">'+e+'</button>'}).join("")+'</div>';
  h+='<div class="row" style="margin-top:8px"><input type="text" id="pe" placeholder="Or type any emoji" style="flex:1"><button onclick="setPic(\''+r.id+'\',document.getElementById(\'pe\').value)">Use</button></div>';
  h+='<label class="mu" style="display:block;margin-top:10px">Or upload a photo<input type="file" accept="image/*" onchange="upPic(\''+r.id+'\',this)"></label>';
  if(r.c&&r.img)h+='<button style="margin-top:8px" onclick="resetPic(\''+r.id+'\')">Remove photo</button>';
  if(!r.c&&S.pics[r.id])h+='<button style="margin-top:8px" onclick="resetPic(\''+r.id+'\')">Reset to original</button>';
  return h+'</div>';
}
function setPic(id,e){
  e=(e||"").trim();if(!e)return;
  var r=find(id);if(!r||r.isText)return;
  if(r.c){r.e=em(e);delete r.img}else{S.pics[id]={e:em(e)};applyPics()}
  if(save())toast("Picture changed");render();
}
function upPic(id,inp){
  var f=inp.files[0];if(!f)return;
  var r=find(id);if(!r)return;
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){
      var sc=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      var u=c.toDataURL("image/jpeg",.7);
      if(r.c)r.img=u;else{S.pics[id]=Object.assign({},S.pics[id],{img:u});applyPics()}
      if(save())toast("Picture changed");render();
    };
    im.onerror=function(){toast("That file could not be read as a picture.")};
    im.src=fr.result};
  fr.readAsDataURL(f);
}
function resetPic(id){
  var r=find(id);if(!r)return;
  if(r.c)delete r.img;else{delete S.pics[id];applyPics()}
  save();toast("Picture updated");render();
}
function pickX(w,k,v){if(w==="a")pickA(k,v);else pick(k,v)}
function pickT(w,k,v){
  v=v.trim();var m=w==="a"?S.apl:S.plan;
  if(v){m[k]="t:"+v;if(w==="a")delete S.link[k]}
  else if(m[k]&&m[k].slice(0,2)==="t:")delete m[k];
  save();render();
}
function repeatW(w,key){
  var m=w==="a"?S.apl:S.plan,s=key.split("-")[1],v=m[key],lk=S.link[key];
  DAYS.forEach(function(d){var k=d+"-"+s;m[k]=v;if(w==="a"&&lk)S.link[k]=1;else delete S.link[k]});
  save();toast("Repeated for the whole week");render();
}
function pick(k,v){if(v)S.plan[k]=v;else delete S.plan[k];save();render()}
function fill(){
  var pool=all().filter(ok);
  if(!pool.length){toast("No recipes match your pantry and baby’s age yet. Add more items in Pantry.");return}
  var n=0;
  DAYS.forEach(function(d){slots().forEach(function(o){S.plan[d+"-"+o.i]=pool[n%pool.length].id;n++})});
  save();render();
}
init();
</script>
</body></html>
